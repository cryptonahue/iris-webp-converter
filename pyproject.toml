[project]
name = "iris-webp-converter"
version = "0.1.0"
description = "Convert SVG, JPG, JPEG, and PNG images to WebP while preserving folder structure."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
iris = "iris.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
svg = [
    "cairosvg>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
